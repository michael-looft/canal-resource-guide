  .header-title { font-size: 20px; font-weight: 700; flex: 1; }

// ─── LANGUAGE ────────────────────────────────────────────────────────────────
let lang = 'en';
let currentCat = null;
let searchQuery = '';

const t = {
  en: {
    headerTitle: "Canal Resources",
    langBtn: "Español",
    protoBadge: "⚗️ Prototype B — Browse by Category | Feedback welcome!",
    searchPlaceholder: "Search all resources…",
    allCategories: "Browse Categories",
    dial211: "Need help finding the right resource?",
    dial211sub: "Call 211 — free, 24/7, in any language",
    dial211btn: "Call 211",
    noResults: "No resources found for",
    tryAgain: "Try a different search term.",
    back: "← All Categories",
    callBtn: "📞 Call",
    webBtn: "🌐 Website",
    searchResultsFor: "Results for",
    resources: "resources"
  },
  es: {
    headerTitle: "Recursos del Canal",
    langBtn: "English",
    protoBadge: "⚗️ Prototipo B — Explorar por Categoría | ¡Sus comentarios son bienvenidos!",
    searchPlaceholder: "Buscar todos los recursos…",
    allCategories: "Explorar Categorías",
    dial211: "¿Necesita ayuda para encontrar el recurso correcto?",
    dial211sub: "Llame al 211 — gratuito, 24/7, en cualquier idioma",
    dial211btn: "Llamar al 211",
    noResults: "No se encontraron recursos para",
    tryAgain: "Intente con otro término de búsqueda.",
    back: "← Todas las Categorías",
    callBtn: "📞 Llamar",
    webBtn: "🌐 Sitio web",
    searchResultsFor: "Resultados para",
    resources: "recursos"
  }
};

function toggleLang() {
  lang = lang === 'en' ? 'es' : 'en';
  applyLang();
  render();
}

function applyLang() {
  const tx = t[lang];
  document.getElementById('header-title').textContent = currentCat
    ? (lang === 'en' ? categories.find(c => c.id === currentCat)?.en : categories.find(c => c.id === currentCat)?.es)
    : tx.headerTitle;
  document.getElementById('lang-btn').textContent = tx.langBtn;
  document.getElementById('proto-badge').textContent = tx.protoBadge;
  document.getElementById('search-input').placeholder = tx.searchPlaceholder;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  if (searchQuery.length > 1) {
    renderSearch();
  } else if (currentCat) {
    renderCategory(currentCat);
  } else {
    renderHome();
  }
}

function renderHome() {
  const tx = t[lang];
  document.getElementById('back-btn').classList.remove('visible');

  // Count resources per category
  const counts = {};
  resources.forEach(r => r.cat.forEach(c => { counts[c] = (counts[c] || 0) + 1; }));

  const grid = categories.map(cat => {
    const name = lang === 'en' ? cat.en : cat.es;
    const count = counts[cat.id] || 0;
    return `
      <div class="cat-card" onclick="selectCategory('${cat.id}')">
        <span class="cat-emoji">${cat.emoji}</span>
        <div class="cat-name">${name}</div>
        <div class="cat-count">${count} ${tx.resources}</div>
      </div>
    `;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="banner-211">
      <div class="number">211</div>
      <div class="info">
        <strong>${tx.dial211}</strong>
        <span>${tx.dial211sub}</span>
      </div>
      <a href="tel:211">${tx.dial211btn}</a>
    </div>
    <div class="section-title" style="margin-bottom:12px">${tx.allCategories}</div>
    <div class="category-grid">${grid}</div>
  `;
}

function selectCategory(catId) {
  currentCat = catId;
  const cat = categories.find(c => c.id === catId);
  document.getElementById('header-title').textContent = lang === 'en' ? cat.en : cat.es;
  document.getElementById('back-btn').classList.add('visible');
  renderCategory(catId);
}

function goHome() {
  currentCat = null;
  searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  applyLang();
  renderHome();
}

function renderCategory(catId) {
  const tx = t[lang];
  const filtered = resources.filter(r => r.cat.includes(catId));
  const cards = filtered.map(buildCard).join('');
  document.getElementById('content').innerHTML = `
    <div class="resource-list visible">${cards}</div>
  `;
}

function renderSearch() {
  const tx = t[lang];
  const q = searchQuery.toLowerCase();
  const filtered = resources.filter(r => {
    const name = (lang === 'en' ? r.name : r.nameEs).toLowerCase();
    const services = (lang === 'en' ? r.services : r.servicesEs).toLowerCase();
    const cats = r.cat.join(' ');
    return name.includes(q) || services.includes(q) || cats.includes(q);
  });

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="big">🔍</div>
        <p><strong>${tx.noResults} "${searchQuery}".</strong><br>${tx.tryAgain}</p>
      </div>
    `;
    return;
  }

  const cards = filtered.map(buildCard).join('');
  document.getElementById('content').innerHTML = `
    <div class="search-results-label">${tx.searchResultsFor} "<strong>${searchQuery}</strong>" — ${filtered.length} ${tx.resources}</div>
    <div class="resource-list visible">${cards}</div>
  `;
}

function buildCard(r) {
  const tx = t[lang];
  const name = lang === 'en' ? r.name : r.nameEs;
  const services = lang === 'en' ? r.services : r.servicesEs;
  const cat = categories.find(c => r.cat.includes(c.id));
  const catName = cat ? (lang === 'en' ? cat.en : cat.es) : '';

  return `
    <div class="resource-card">
      <div class="rc-header">
        <div class="rc-name">${name}</div>
        <span class="rc-badge">${catName}</span>
      </div>
      ${r.address ? `<div class="rc-detail"><span class="icon">📍</span><span>${r.address}</span></div>` : ''}
      ${r.hours ? `<div class="rc-detail"><span class="icon">🕐</span><span>${r.hours}</span></div>` : ''}
      <div class="rc-services-list">${services}</div>
      <div class="rc-actions">
        <a href="tel:${r.phone}" class="rc-btn call">${tx.callBtn} ${r.phoneDisplay}</a>
        ${r.website ? `<a href="${r.website}" target="_blank" class="rc-btn web">${tx.webBtn}</a>` : ''}
      </div>
    </div>
  `;
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function onSearch(val) {
  searchQuery = val.trim();
  document.getElementById('clear-btn').classList.toggle('visible', val.length > 0);

  if (searchQuery.length > 1) {
    currentCat = null;
    document.getElementById('back-btn').classList.remove('visible');
    document.getElementById('header-title').textContent = t[lang].headerTitle;
    renderSearch();
  } else if (!currentCat) {
    renderHome();
  }
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('clear-btn').classList.remove('visible');
  if (currentCat) renderCategory(currentCat);
  else renderHome();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyLang();
renderHome();
</script>

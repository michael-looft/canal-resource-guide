    font-weight: 500;
    border-bottom: 1px solid #FFEAA7;

    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 160px;

  .msg-row.user { flex-direction: row-reverse; }
  .bot-icon {
    width: 32px; height: 32px;
    background: var(--primary);
    border-radius: 50%;

    color: var(--text);
  }
  .bubble.user {
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }
  .bubble .timestamp {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    text-align: right;
  }

    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;

    font-weight: 500;

    display: flex;

    padding: 10px 14px;
    background: white;
    border-radius: 18px;

  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }

    addressLabel: "Dirección:",

};

function toggleLang() {
  lang = lang === 'en' ? 'es' : 'en';
  applyLang();
  document.getElementById('chat').innerHTML = '';
  showWelcome();
}

function applyLang() {
  const tx = t[lang];
  document.getElementById('header-name').textContent = tx.headerName;
  document.getElementById('header-sub').textContent = tx.headerSub;
  document.getElementById('lang-btn').textContent = tx.langBtn;
  document.getElementById('proto-badge').textContent = tx.protoBadge;
  document.getElementById('user-input').placeholder = tx.placeholder;
}

// ─── CHAT ENGINE ──────────────────────────────────────────────────────────────
function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addBotMsg(html, delay = 600) {
  return new Promise(resolve => {
    // Show typing
    const typingRow = document.createElement('div');
    typingRow.className = 'msg-row';
    typingRow.innerHTML = `
      <div class="bot-icon">🏘️</div>
      <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    const chat = document.getElementById('chat');
    chat.appendChild(typingRow);
    scrollBottom();

    setTimeout(() => {
      typingRow.remove();
      const row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML = `
        <div class="bot-icon">🏘️</div>
        <div class="bubble bot">${html}<div class="timestamp">${getTime()}</div></div>
      `;
      chat.appendChild(row);
      scrollBottom();
      resolve();
    }, delay);
  });
}

function addUserMsg(text) {
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble user">${text}<div class="timestamp">${getTime()}</div></div>`;
  chat.appendChild(row);
  scrollBottom();
}

function scrollBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

function searchResources(query) {
  const q = query.toLowerCase();
  const scored = resources.map(r => {
    let score = 0;
    r.tags.forEach(tag => { if (q.includes(tag)) score += 10; });
    // Check individual words
    q.split(' ').forEach(word => {
      if (word.length < 3) return;
      r.tags.forEach(tag => { if (tag.includes(word)) score += 5; });
      if (r.name.toLowerCase().includes(word)) score += 3;
      if ((lang === 'en' ? r.services : r.servicesEs).toLowerCase().includes(word)) score += 2;
    });
    return { ...r, score };
  });
  return scored.filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 4);
}

function buildResourceCard(r) {
  const tx = t[lang];
  const name = lang === 'en' ? r.name : r.nameEs;
  const cat = lang === 'en' ? r.category : r.categoryEs;
  const services = lang === 'en' ? r.services : r.servicesEs;
  return `
    <div class="resource-card">
      <div class="rc-name">${name}</div>
      <span class="rc-category">${cat}</span>
      <div class="rc-detail"><span class="icon">📍</span><span>${r.address}</span></div>
      ${r.hours ? `<div class="rc-detail"><span class="icon">🕐</span><span>${r.hours}</span></div>` : ''}
      <div class="rc-services">${tx.servicesLabel} ${services}</div>
      <div class="rc-actions">
        <a href="tel:${r.phone}" class="rc-btn call">${tx.callBtn} ${r.phoneDisplay}</a>
        ${r.website ? `<a href="${r.website}" target="_blank" class="rc-btn web">${tx.webBtn}</a>` : ''}
      </div>
    </div>
  `;
}

function buildSuggestions() {
  const tx = t[lang];
  return `
    <div class="suggestions-label">${lang === 'en' ? 'Tap a question to get started:' : 'Toque una pregunta para comenzar:'}</div>
    <div class="suggestions">
      ${tx.suggestions.map(s => `<div class="chip" onclick="handleChip(this)">${s}</div>`).join('')}
    </div>
  `;
}

function handleChip(chip) {
  const text = chip.textContent;
  sendMessage(text);
}

function handleKey(e) {
  if (e.key === 'Enter') sendMessage();
}

async function sendMessage(override) {
  const input = document.getElementById('user-input');
  const text = override || input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('send-btn').disabled = true;

  addUserMsg(text);
  await new Promise(r => setTimeout(r, 300));

  const results = searchResources(text);
  const tx = t[lang];

  if (results.length === 0) {
    await addBotMsg(tx.notFound);
  } else {
    const intro = tx.found(results.length);
    const cards = results.map(buildResourceCard).join('');
    await addBotMsg(`${intro}${cards}`, 800);
  }

  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function showWelcome() {
  const tx = t[lang];
  const chat = document.getElementById('chat');

  setTimeout(() => {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.innerHTML = `
      <div class="bot-icon">🏘️</div>
      <div class="bubble bot">
        ${tx.welcome1}
        <div class="timestamp">${getTime()}</div>
      </div>
    `;
    chat.appendChild(row);
    scrollBottom();

    setTimeout(() => {
      const row2 = document.createElement('div');
      row2.className = 'msg-row';
      row2.innerHTML = `
        <div class="bot-icon">🏘️</div>
        <div class="bubble bot">
          ${tx.welcome2}
          ${buildSuggestions()}
          <div class="timestamp">${getTime()}</div>
        </div>
      `;
      chat.appendChild(row2);
      scrollBottom();
    }, 800);
  }, 400);
}

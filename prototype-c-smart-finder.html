    --accent: #FF6F00;

  body {

    color: var(--text);

  .header-top {

  .header-sub { font-size: 11px; opacity: 0.8; margin-top: 1px; }
  .lang-toggle {

    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .lang-toggle:hover { background: rgba(255,255,255,0.3); }

  .search-wrap {
    display: flex;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .search-wrap .icon { padding: 0 10px 0 14px; display: flex; align-items: center; color: #aaa; font-size: 16px; }
  .search-wrap input {
    flex: 1;
    border: none;
    outline: none;
    padding: 12px 0;
    font-size: 15px;
    color: var(--text);
  }
  .search-wrap input::placeholder { color: #bbb; }
  .search-clear {
    background: none;
    border: none;
    padding: 0 14px;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
    display: none;
    align-items: center;
  }
  .search-clear.visible { display: flex; }

  /* PROTO BADGE */
  .proto-badge {
    background: #EDE7F6;
    color: var(--primary-dark);
    text-align: center;
    font-size: 11px;
    padding: 5px 12px;
    font-weight: 500;
    border-bottom: 1px solid #D1C4E9;
  }

  /* FILTER STRIP */
  .filter-strip {
    padding: 12px 12px 0;
    position: sticky;
    top: 116px;
    z-index: 200;
    background: var(--bg);
    padding-bottom: 10px;
  }
  .filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    white-space: nowrap;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: white;
    color: var(--muted);
    transition: all 0.15s;
  }
  .filter-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  .filter-chip:hover:not(.active) {
    border-color: var(--primary);
    color: var(--primary);
  }

  /* CONTENT */
  .content { padding: 12px 12px 100px; }

    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .results-header strong { color: var(--text); }

    display: flex;
    align-items: flex-start;
    gap: 6px;
    line-height: 1.4;

    line-height: 1.6;
    display: -webkit-box;

    -webkit-box-orient: vertical;
    overflow: hidden;

  .rc-btn {

    padding: 9px 8px;

    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;

    color: var(--muted);

    border-radius: 8px;
    text-decoration: none;

    border-radius: 28px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;

    align-items: center;
    gap: 8px;
    z-index: 400;

    border-radius: 16px;

function toggleLang() {
  lang = lang==='en'?'es':'en';
  applyLang();
  renderFilters();
  renderContent();
}

function applyLang() {
  const tx = T[lang];
  document.getElementById('header-name').textContent = tx.headerName;
  document.getElementById('header-sub').textContent = tx.headerSub;
  document.getElementById('lang-btn').textContent = tx.langBtn;
  document.getElementById('proto-badge').textContent = tx.badge;
  document.getElementById('search').placeholder = tx.searchPlaceholder;
  document.getElementById('fab-text').textContent = tx.fabText;
  document.getElementById('chat-panel-title').textContent = tx.chatTitle;
  document.getElementById('chat-input').placeholder = tx.chatPlaceholder;
}

// ─── FILTERS ─────────────────────────────────────────────────────────────────
function renderFilters() {
  const html = CATEGORIES.map(cat => {
    const label = lang==='en'?cat.en:cat.es;
    return `<div class="filter-chip${activeCat===cat.id?' active':''}" onclick="setFilter('${cat.id}')">${cat.emoji} ${label}</div>`;
  }).join('');
  document.getElementById('filters').innerHTML = html;
}

function setFilter(catId) {
  activeCat = catId;
  renderFilters();
  renderContent();
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function onSearch(val) {
  searchVal = val.trim();
  document.getElementById('search-clear').classList.toggle('visible', val.length>0);
  renderContent();
}
function clearSearch() {
  document.getElementById('search').value='';
  searchVal='';
  document.getElementById('search-clear').classList.remove('visible');
  renderContent();
}

// ─── CONTENT ─────────────────────────────────────────────────────────────────
function renderContent() {
  const tx = T[lang];
  let filtered = resources;

  if (activeCat !== 'all') {
    filtered = filtered.filter(r => r.cats.includes(activeCat));
  }

  if (searchVal.length > 1) {
    const q = searchVal.toLowerCase();
    filtered = filtered.filter(r => {
      const name = (lang==='en'?r.name:r.nameEs).toLowerCase();
      const svc = (lang==='en'?r.services:r.servicesEs).toLowerCase();
      const tags = r.tags.join(' ');
      return name.includes(q) || svc.includes(q) || tags.includes(q);
    });
  }

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty">
        <div class="emoji">🔍</div>
        <p>${tx.noResults}</p>
      </div>
    `;
    return;
  }

  const catLabel = activeCat==='all'
    ? tx.allResources
    : (CATEGORIES.find(c=>c.id===activeCat)?.[lang==='en'?'en':'es'] || '');

  const cards = filtered.map(r => buildCard(r)).join('');
  document.getElementById('content').innerHTML = `
    <div class="results-header">
      <span>${tx.showing} <strong>${filtered.length}</strong> ${tx.resultsFor} ${searchVal?`"${searchVal}"`:''}</span>
      <span>${catLabel}</span>
    </div>
    ${cards}
  `;
}

function buildCard(r) {
  const tx = T[lang];
  const name = lang==='en'?r.name:r.nameEs;
  const svc = lang==='en'?r.services:r.servicesEs;
  const cat = CATEGORIES.find(c => r.cats.includes(c.id) && c.id!=='all');
  const catLabel = cat?(lang==='en'?cat.en:cat.es):'';

  return `
    <div class="resource-card">
      <div class="rc-top">
        <div class="rc-name">${name}</div>
        <span class="rc-cat-badge">${catLabel}</span>
      </div>
      ${r.address?`<div class="rc-detail"><span class="icon">📍</span><span>${r.address}</span></div>`:''}
      ${r.hours?`<div class="rc-detail"><span class="icon">🕐</span><span>${r.hours}</span></div>`:''}
      <div class="rc-services">${svc}</div>
      <div class="rc-actions">
        <a href="tel:${r.phone}" class="rc-btn call">${tx.callBtn} ${r.phoneDisplay}</a>
        ${r.website?`<a href="${r.website}" target="_blank" class="rc-btn web">${tx.webBtn}</a>`:''}
      </div>
    </div>
  `;
}

// ─── CHAT PANEL ───────────────────────────────────────────────────────────────
let chatStarted = false;

function openChat() {
  document.getElementById('chat-overlay').classList.add('open');
  if (!chatStarted) {
    initChat();
    chatStarted = true;
  }
  setTimeout(() => document.getElementById('chat-input').focus(), 400);
}

function closeChat() {
  document.getElementById('chat-overlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('chat-overlay')) closeChat();
}

function initChat() {
  const tx = T[lang];
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';

  addChatBotMsg(tx.chatWelcome + `
    <div class="chat-chips">
      ${tx.chatSuggestions.map(s=>`<div class="chat-chip" onclick="chatChip(this)">${s}</div>`).join('')}
    </div>
  `);
}

function addChatBotMsg(html, delay=600) {
  return new Promise(resolve => {
    const msgs = document.getElementById('chat-messages');

    const dotRow = document.createElement('div');
    dotRow.className='chat-msg-row';
    dotRow.innerHTML=`<div style="font-size:20px">🏘️</div><div class="chat-dots"><div class="chat-dot"></div><div class="chat-dot"></div><div class="chat-dot"></div></div>`;
    msgs.appendChild(dotRow);
    msgs.scrollTop=msgs.scrollHeight;

    setTimeout(()=>{
      dotRow.remove();
      const row=document.createElement('div');
      row.className='chat-msg-row';
      row.innerHTML=`<div style="font-size:20px;flex-shrink:0">🏘️</div><div class="chat-bubble bot">${html}</div>`;
      msgs.appendChild(row);
      msgs.scrollTop=msgs.scrollHeight;
      resolve();
    },delay);
  });
}

function addChatUserMsg(text) {
  const msgs=document.getElementById('chat-messages');
  const row=document.createElement('div');
  row.className='chat-msg-row user';
  row.innerHTML=`<div class="chat-bubble user">${text}</div>`;
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}

function chatKey(e) {
  if (e.key==='Enter') chatSend();
}

function chatChip(el) {
  chatSend(el.textContent);
}

function searchForChat(query) {
  const q=query.toLowerCase();
  const scored=resources.map(r=>{
    let score=0;
    r.tags.forEach(tag=>{if(q.includes(tag))score+=10;});
    q.split(' ').forEach(word=>{
      if(word.length<3)return;
      r.tags.forEach(tag=>{if(tag.includes(word))score+=4;});
      if((lang==='en'?r.name:r.nameEs).toLowerCase().includes(word))score+=3;
      if((lang==='en'?r.services:r.servicesEs).toLowerCase().includes(word))score+=2;
    });
    return {...r,score};
  });
  return scored.filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

async function chatSend(override) {
  const input=document.getElementById('chat-input');
  const text=override||input.value.trim();
  if(!text)return;
  input.value='';

  addChatUserMsg(text);
  const tx=T[lang];
  const results=searchForChat(text);

  if(results.length===0){
    await addChatBotMsg(tx.chatNotFound);
  } else {
    const cards=results.map(r=>{
      const name=lang==='en'?r.name:r.nameEs;
      const svc=(lang==='en'?r.services:r.servicesEs).split(',').slice(0,3).join(', ');
      return `
        <div class="mini-card">
          <strong>${name}</strong>
          ${r.address?`📍 ${r.address}<br>`:''}
          📞 <a href="tel:${r.phone}">${r.phoneDisplay}</a>
          ${r.website?`&nbsp;|&nbsp;<a href="${r.website}" target="_blank">Website</a>`:''}
          <div style="color:#555;margin-top:3px;font-size:11.5px">${svc}</div>
        </div>
      `;
    }).join('');
    await addChatBotMsg(`${tx.chatFound(results.length)}${cards}`, 800);
  }
  input.focus();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyLang();
renderFilters();
renderContent();
</script>
